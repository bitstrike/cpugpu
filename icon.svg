<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for modern look -->
    <linearGradient id="cpuGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="gpuGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ed321;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5ba517;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e8e8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="shadowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.05" />
    </linearGradient>
    
    <!-- Drop shadow filter -->
    <filter id="dropshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="2" dy="2" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with subtle gradient -->
  <circle cx="24" cy="24" r="22" fill="url(#backgroundGradient)" stroke="#d0d0d0" stroke-width="1" filter="url(#dropshadow)"/>
  
  <!-- CPU Chip representation (main component) -->
  <g transform="translate(8, 8)">
    <!-- CPU base -->
    <rect x="4" y="4" width="24" height="24" rx="3" ry="3" fill="url(#cpuGradient)" stroke="#2c5aa0" stroke-width="1"/>
    
    <!-- CPU grid pattern (representing cores) -->
    <g stroke="#ffffff" stroke-width="0.8" opacity="0.7">
      <line x1="10" y1="8" x2="10" y2="24"/>
      <line x1="16" y1="8" x2="16" y2="24"/>
      <line x1="22" y1="8" x2="22" y2="24"/>
      <line x1="8" y1="10" x2="24" y2="10"/>
      <line x1="8" y1="16" x2="24" y2="16"/>
      <line x1="8" y1="22" x2="24" y2="22"/>
    </g>
    
    <!-- CPU pins/connectors -->
    <g fill="#666666">
      <rect x="2" y="10" width="2" height="1"/>
      <rect x="2" y="13" width="2" height="1"/>
      <rect x="2" y="16" width="2" height="1"/>
      <rect x="2" y="19" width="2" height="1"/>
      <rect x="28" y="10" width="2" height="1"/>
      <rect x="28" y="13" width="2" height="1"/>
      <rect x="28" y="16" width="2" height="1"/>
      <rect x="28" y="19" width="2" height="1"/>
      <rect x="10" y="2" width="1" height="2"/>
      <rect x="13" y="2" width="1" height="2"/>
      <rect x="16" y="2" width="1" height="2"/>
      <rect x="19" y="2" width="1" height="2"/>
      <rect x="10" y="28" width="1" height="2"/>
      <rect x="13" y="28" width="1" height="2"/>
      <rect x="16" y="28" width="1" height="2"/>
      <rect x="19" y="28" width="1" height="2"/>
    </g>
  </g>
  
  <!-- GPU representation (smaller, positioned as secondary component) -->
  <g transform="translate(28, 28)">
    <rect x="2" y="2" width="16" height="10" rx="2" ry="2" fill="url(#gpuGradient)" stroke="#4a7c0f" stroke-width="1"/>
    <!-- GPU memory chips -->
    <g fill="#ffffff" opacity="0.8">
      <rect x="4" y="4" width="2" height="2"/>
      <rect x="7" y="4" width="2" height="2"/>
      <rect x="10" y="4" width="2" height="2"/>
      <rect x="13" y="4" width="2" height="2"/>
      <rect x="4" y="7" width="2" height="2"/>
      <rect x="7" y="7" width="2" height="2"/>
      <rect x="10" y="7" width="2" height="2"/>
      <rect x="13" y="7" width="2" height="2"/>
    </g>
  </g>
  
  <!-- Activity indicators (animated-style bars representing monitoring) -->
  <g transform="translate(6, 35)">
    <!-- CPU activity bars -->
    <rect x="0" y="0" width="2" height="8" fill="#4a90e2" opacity="0.9"/>
    <rect x="3" y="2" width="2" height="6" fill="#4a90e2" opacity="0.7"/>
    <rect x="6" y="1" width="2" height="7" fill="#4a90e2" opacity="0.8"/>
    <rect x="9" y="3" width="2" height="5" fill="#4a90e2" opacity="0.6"/>
    
    <!-- GPU activity bars -->
    <rect x="15" y="1" width="2" height="7" fill="#7ed321" opacity="0.8"/>
    <rect x="18" y="0" width="2" height="8" fill="#7ed321" opacity="0.9"/>
    <rect x="21" y="2" width="2" height="6" fill="#7ed321" opacity="0.7"/>
    <rect x="24" y="4" width="2" height="4" fill="#7ed321" opacity="0.5"/>
  </g>
  
  <!-- Monitoring symbol (small radar/pulse icon) -->
  <g transform="translate(34, 6)">
    <circle cx="6" cy="6" r="5" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.8"/>
    <circle cx="6" cy="6" r="3" fill="none" stroke="#ff6b35" stroke-width="1" opacity="0.6"/>
    <circle cx="6" cy="6" r="1" fill="#ff6b35"/>
    <!-- Pulse lines -->
    <line x1="6" y1="1" x2="6" y2="3" stroke="#ff6b35" stroke-width="1.5" opacity="0.7"/>
    <line x1="11" y1="6" x2="9" y2="6" stroke="#ff6b35" stroke-width="1.5" opacity="0.7"/>
  </g>
  
  <!-- Subtle highlight for 3D effect -->
  <circle cx="24" cy="24" r="22" fill="none" stroke="url(#shadowGradient)" stroke-width="1" opacity="0.3"/>
  <circle cx="23" cy="23" r="20" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.6"/>
</svg>